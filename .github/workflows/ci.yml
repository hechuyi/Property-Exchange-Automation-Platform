name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7
        with:
          version: "0.11.1"
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Check lockfile
        run: uv lock --check

      - name: Sync project environment
        run: uv sync --locked

      - name: Ruff
        run: >
          uv run ruff check
          desktop_backend
          peap
          peap_core
          peap_parsers
          peap_postprocess
          tests
          config.py
          scripts

      - name: Unit tests
        run: uv run python -m pytest tests
